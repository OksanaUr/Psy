<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Метафоричні карти</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1ef; --surface:#ffffff; --surface-2:#e3e9e6; --text:#1c2a2b; --muted:#5c6c6c;
  --line:#cdd7d3; --accent:#2f6f62; --accent-ink:#ffffff; --pick:#d9922e; --scrim:rgba(3,6,6,.97);
  --cw:170px; --ar:7/5;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#172022; --surface:#21302f; --surface-2:#2b3d3c; --text:#e6eeec; --muted:#9db1ae;
    --line:#37504d; --accent:#8cc9b8; --accent-ink:#10201d; --pick:#f0b25a; --scrim:rgba(0,0,0,.97);
  }
}
:root[data-theme="dark"]{
  --bg:#172022; --surface:#21302f; --surface-2:#2b3d3c; --text:#e6eeec; --muted:#9db1ae;
  --line:#37504d; --accent:#8cc9b8; --accent-ink:#10201d; --pick:#f0b25a; --scrim:rgba(0,0,0,.97);
}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;min-height:100%;background:var(--bg);color:var(--text);
  font-family:"Onest",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:16px;line-height:1.45}
button,select{font:inherit;color:inherit}

/* panel */
.panel{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);
  border-bottom:1px solid var(--line);padding:0 clamp(12px,3vw,28px) 12px}
.topbar{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--line);margin:0 calc(-1*clamp(12px,3vw,28px)) 12px;
  padding:10px clamp(12px,3vw,28px)}
.topbar h1{font-size:18px;font-weight:600;margin:0;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.btn.home-btn{min-height:36px;padding:6px 12px;white-space:nowrap}

/* title page */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:clamp(28px,6vh,72px) clamp(16px,4vw,40px) 40px}
.home-head{text-align:center;margin-bottom:clamp(24px,5vh,48px)}
.home-head .mono{width:46px;height:46px;margin:0 auto 14px;display:block}
.home-head h1{font-size:clamp(26px,4vw,36px);font-weight:600;margin:0 0 6px;letter-spacing:.01em}
.home-head p{margin:0;color:var(--muted);font-size:17px}
.deck-list{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(300px,100%),1fr));gap:clamp(16px,3vw,28px);width:100%;max-width:820px}
.deck-tile{border:1px solid var(--line);background:var(--surface);border-radius:18px;padding:26px 22px 22px;cursor:pointer;text-align:left;
  display:flex;flex-direction:column;gap:20px;transition:transform .2s,box-shadow .2s}
.deck-tile:hover{transform:translateY(-3px);box-shadow:0 10px 28px rgba(0,0,0,.14)}
.deck-tile:focus-visible{outline:3px solid var(--pick);outline-offset:3px}
.fan{position:relative;height:200px}
.fan img,.fan .fback{position:absolute;left:50%;bottom:6px;border-radius:9px;box-shadow:0 6px 18px rgba(0,0,0,.3);object-fit:cover;transform-origin:50% 100%;transition:transform .3s}
.fan.land{height:170px}
.fan.land img{width:54%;aspect-ratio:7/5}
.fan.port img,.fan.port .fback{height:180px;aspect-ratio:2/3}
.fan .c0{transform:translateX(-50%) rotate(-12deg) translateX(-28%)}
.fan .c1{transform:translateX(-50%) rotate(0deg)}
.fan .c2{transform:translateX(-50%) rotate(12deg) translateX(28%)}
.deck-tile:hover .fan .c0{transform:translateX(-50%) rotate(-16deg) translateX(-36%)}
.deck-tile:hover .fan .c2{transform:translateX(-50%) rotate(16deg) translateX(36%)}
.fan .fback{background:#1b2140 url("img/back-svitlo.svg") center/100% 100% no-repeat}
.fan.land .fback{display:none}
.deck-tile h2{margin:0 0 4px;font-size:21px;font-weight:600}
.deck-tile p{margin:0;color:var(--muted);font-size:15px}
.deck-tile .go{margin-top:12px;display:inline-block;color:var(--accent);font-weight:500}
body:not(.in-deck) .panel,body:not(.in-deck) main,body:not(.in-deck) .tray,body:not(.in-deck) .reveal{display:none !important}
body.in-deck .home{display:none}
.controls{display:flex;flex-wrap:wrap;gap:12px 28px;align-items:flex-end}
.group{display:flex;flex-direction:column;gap:5px}
.group>span{font-size:13px;color:var(--muted)}
.group[hidden]{display:none}
.seg{display:inline-flex;background:var(--surface-2);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 14px;border-radius:8px;cursor:pointer;min-height:36px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:500}
select.sel{border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:8px 12px;min-height:42px;cursor:pointer}
.seg button:focus-visible,.btn:focus-visible,.card:focus-visible,.thumb:focus-visible,input:focus-visible,select:focus-visible,.ov-card:focus-visible{outline:3px solid var(--pick);outline-offset:2px}
.zoom input{width:140px;accent-color:var(--accent)}
.btn{border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:10px;cursor:pointer;min-height:40px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:500}
.btn.primary:hover{filter:brightness(1.06)}
.btn[disabled]{opacity:.45;cursor:default}
.spacer{flex:1}
.status{font-size:15px;color:var(--muted);align-self:center;min-width:120px}
.status b{color:var(--text);font-weight:600}
body.compact .panel{display:none}
.reveal{position:fixed;top:calc(8px + env(safe-area-inset-top,0px));right:10px;z-index:25;display:none;opacity:.55}
.reveal:hover,.reveal:focus-visible{opacity:1}
body.compact .reveal{display:block}

/* grid */
main{padding:clamp(12px,2.5vw,26px) clamp(12px,3vw,28px) 130px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(var(--cw),1fr));gap:calc(var(--cw)*.075)}
.card{position:relative;aspect-ratio:var(--ar);border:0;padding:0;background:none;cursor:pointer;perspective:900px;
  border-radius:10px;transition:opacity .25s}
.inner{position:absolute;inset:0;transform-style:preserve-3d;transition:transform .6s cubic-bezier(.3,.7,.2,1)}
.card.flipped .inner{transform:rotateY(180deg)}
.grid.instant .inner{transition:none}
.face{position:absolute;inset:0;border-radius:10px;overflow:hidden;backface-visibility:hidden;-webkit-backface-visibility:hidden}
.front{transform:rotateY(180deg);background:var(--surface-2);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.front img{width:100%;height:100%;object-fit:cover;display:block}
.back{background:repeating-radial-gradient(circle at 50% 50%,#3b5c59 0 2px,#2c4846 2px 15px);box-shadow:0 1px 3px rgba(0,0,0,.25)}
.back::after{content:"";position:absolute;inset:8%;border:1px solid rgba(255,255,255,.28);border-radius:7px}
.grid[data-deck="svitlo"] .back{background:#1b2140 url("img/back-svitlo.svg") center/100% 100% no-repeat}
.grid[data-deck="svitlo"] .back::after{display:none}
.card:not(.flipped):hover .inner{transform:translateY(-3px)}
.card.picked .face{box-shadow:0 0 0 4px var(--pick)}
.card .num{position:absolute;top:8px;right:8px;z-index:3;min-width:26px;height:26px;padding:0 7px;border-radius:13px;
  background:var(--pick);color:#1b1408;font-weight:600;font-size:14px;display:none;align-items:center;justify-content:center}
.card.picked.open .num{display:flex}
.grid.locked .card:not(.picked){opacity:.3;pointer-events:none}
.pos{position:absolute;top:7px;left:7px;z-index:3;min-width:25px;height:25px;padding:0 7px;border-radius:13px;
  background:rgba(8,14,14,.74);color:#fff;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;pointer-events:none}
body.nonum .pos{display:none}

/* tray */
.tray{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:1px solid var(--line);
  padding:10px clamp(12px,3vw,28px) calc(10px + env(safe-area-inset-bottom,0px));display:flex;gap:14px;align-items:center}
.thumbs{display:flex;gap:10px;flex:1;overflow-x:auto;min-height:58px;align-items:center}
.thumb{border:0;padding:0;background:none;cursor:pointer;border-radius:8px;flex:none}
.thumb img{height:58px;width:auto;display:block;border-radius:8px;box-shadow:0 0 0 2px var(--pick)}
.empty{color:var(--muted);font-size:15px}

/* overlay */
.overlay{backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);position:fixed;inset:0;z-index:40;background:var(--scrim);display:none;flex-direction:column;
  padding:calc(16px + env(safe-area-inset-top,0px)) clamp(12px,3vw,32px) calc(16px + env(safe-area-inset-bottom,0px))}
.overlay.on{display:flex}
.ov-bar{display:flex;flex-wrap:wrap;gap:10px 12px;align-items:center;justify-content:space-between;color:#eef4f2;margin-bottom:14px}
.ov-bar h2{margin:0;font-size:18px;font-weight:500}
.ov-tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.ov-bar .btn,.ov-bar select.sel{background:rgba(255,255,255,.1);color:#eef4f2;border-color:rgba(255,255,255,.25)}
.ov-bar select.sel option{color:#1c2a2b;background:#fff}
.ov-bar .btn:hover{background:rgba(255,255,255,.2)}
.ov-bar [hidden]{display:none}
.ov-body{flex:1;min-height:0;min-width:0;display:flex;align-items:center;justify-content:center;gap:clamp(10px,2vw,24px);position:relative}
.ov-body.table{display:block;overflow:hidden}
.ov-card{position:absolute;border:0;padding:0;background:none;cursor:grab;display:flex;align-items:center;justify-content:center;touch-action:none;user-select:none;-webkit-user-select:none}
.ov-card.dragging{cursor:grabbing;z-index:5}
.ov-card img{display:block;max-width:100%;max-height:100%;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.5);object-fit:contain;pointer-events:none}
.ov-card .badge{position:absolute;top:-9px;left:-9px;min-width:26px;height:26px;padding:0 7px;border-radius:13px;background:var(--pick);
  color:#1b1408;font-weight:600;font-size:14px;display:flex;align-items:center;justify-content:center;box-shadow:0 2px 6px rgba(0,0,0,.4)}
body.nonum .ov-card .badge{display:none}
.ov-hint{position:absolute;left:0;right:0;bottom:0;text-align:center;color:rgba(238,244,242,.55);font-size:13px;pointer-events:none}
.arrow{flex:none;width:48px;height:48px;border-radius:24px;border:1px solid rgba(255,255,255,.3);background:rgba(255,255,255,.1);
  color:#fff;font-size:22px;cursor:pointer}
.arrow:hover{background:rgba(255,255,255,.22)}
.arrow[hidden]{display:none}
@media (max-width:640px){.ov-body.single img{max-width:calc(100vw - 32px)}.arrow{display:none}}
@media (prefers-reduced-motion: reduce){.inner{transition:none}.card{transition:none}}
</style>
</head>
<body>

<section class="home" id="home">
  <div class="home-head">
    <svg class="mono" viewBox="60 110 90 80" aria-hidden="true"><defs><linearGradient id="hau" gradientUnits="userSpaceOnUse" x1="50" y1="110" x2="150" y2="190"><stop offset="0" stop-color="#e8c66e"/><stop offset=".5" stop-color="#b8892f"/><stop offset="1" stop-color="#e2bb5f"/></linearGradient></defs><g fill="none" stroke="url(#hau)" stroke-linecap="round"><circle cx="88" cy="150" r="33" stroke-width="5"/><path d="M96 116 V154 A20 20 0 0 0 136 154 V116" stroke-width="5"/><path d="M89.5 115 H102.5 M129.5 115 H142.5" stroke-width="2.6"/></g></svg>
    <h1>Метафоричні карти</h1>
    <p>Оберіть колоду для сесії</p>
  </div>
  <div class="deck-list" id="deckList"></div>
</section>

<div id="app">
<header class="panel" id="panel">
  <div class="topbar">
    <button class="btn home-btn" id="btnHome">← Усі колоди</button>
    <h1 id="deckTitle"></h1>
  </div>
  <div class="controls">
    <div class="group"><span>Картки</span>
      <div class="seg" id="segView">
        <button data-v="open" aria-pressed="true">Відкриті</button>
        <button data-v="closed" aria-pressed="false">Закриті</button>
      </div>
    </div>
    <label class="group"><span>Розклад</span>
      <select class="sel" id="selLayout"></select>
    </label>
    <div class="group" id="grpCount"><span>Скільки карт обрати</span>
      <div class="seg" id="segCount">
        <button data-n="1" aria-pressed="true">Одну</button>
        <button data-n="2" aria-pressed="false">2</button>
        <button data-n="3" aria-pressed="false">3</button>
        <button data-n="5" aria-pressed="false">5</button>
        <button data-n="0" aria-pressed="false">Скільки завгодно</button>
      </div>
    </div>
    <div class="group"><span>Номери на картках</span>
      <div class="seg" id="segNum">
        <button data-x="1" aria-pressed="true">Показати</button>
        <button data-x="0" aria-pressed="false">Сховати</button>
      </div>
    </div>
    <label class="group zoom"><span>Розмір карток</span>
      <input type="range" id="zoom" min="90" max="300" value="170" step="10">
    </label>
    <div class="status" id="status" aria-live="polite"></div>
    <div class="spacer"></div>
    <button class="btn" id="btnReset">Розкласти заново</button>
    <button class="btn" id="btnHide">Сховати панель</button>
  </div>
</header>
<button class="btn reveal" id="btnShow">Показати панель</button>

<main><div class="grid instant" id="grid" data-deck="vona"></div></main>

<footer class="tray">
  <div class="thumbs" id="thumbs"></div>
  <button class="btn primary" id="btnShowPicks" disabled>Показати вибір</button>
</footer>

</div>

<div class="overlay" id="overlay" role="dialog" aria-modal="true" aria-label="Обрані картки">
  <div class="ov-bar">
    <h2 id="ovTitle">Обрані картки</h2>
    <div class="ov-tools">
      <select class="sel" id="ovLayout" aria-label="Розклад обраних карт"></select>
      <button class="btn" id="btnRealign" hidden>Повернути на місця</button>
      <button class="btn" id="btnBack" hidden>До всіх обраних</button>
      <button class="btn" id="btnClose">Закрити</button>
    </div>
  </div>
  <div class="ov-body" id="ovBody"></div>
</div>

<script>
const VONA_IMGS = Array.from({length:59},(_,i)=>"img/vona/"+String(i+1).padStart(2,"0")+".jpg");

const SVITLO_IMGS = ["img/svitlo/g01.jpg", "img/svitlo/g02.jpg", "img/svitlo/g03.jpg", "img/svitlo/g04.jpg", "img/svitlo/g05.jpg", "img/svitlo/g06.jpg", "img/svitlo/g07.jpg", "img/svitlo/g08.jpg", "img/svitlo/g09.jpg", "img/svitlo/g10.jpg", "img/svitlo/g11.jpg", "img/svitlo/g12.jpg", "img/svitlo/sh01.jpg", "img/svitlo/sh02.jpg", "img/svitlo/sh03.jpg", "img/svitlo/sh04.jpg", "img/svitlo/sh05.jpg", "img/svitlo/sh06.jpg", "img/svitlo/sh07.jpg", "img/svitlo/sh08.jpg", "img/svitlo/sh09.jpg", "img/svitlo/sh10.jpg", "img/svitlo/sh11.jpg", "img/svitlo/sh12.jpg", "img/svitlo/d01.jpg", "img/svitlo/d02.jpg", "img/svitlo/d03.jpg", "img/svitlo/d04.jpg", "img/svitlo/d05.jpg", "img/svitlo/d06.jpg", "img/svitlo/d07.jpg", "img/svitlo/d08.jpg", "img/svitlo/d09.jpg", "img/svitlo/d10.jpg", "img/svitlo/d11.jpg", "img/svitlo/d12.jpg", "img/svitlo/m01.jpg", "img/svitlo/m02.jpg", "img/svitlo/m03.jpg", "img/svitlo/m04.jpg", "img/svitlo/m05.jpg", "img/svitlo/m06.jpg"];
const SVITLO_CARDS = [
 ["Г1","Вітраж"],["Г2","Інше відображення"],["Г3","Птах у дзеркалі"],["Г4","Під маскою"],["Г5","Театр масок"],["Г6","Тінь танцює"],
 ["Г7","Скриня скарбів"],["Г8","Багато відображень"],["Г9","Гардероб ролей"],["Г10","Маска біля обличчя"],["Г11","Калейдоскоп"],["Г12","Матрьошка відкрита"],
 ["Ш1","Золоті шви"],["Ш2","Печворк"],["Ш3","Мозаїка"],["Ш4","Мостик з уламків"],["Ш5","Стара книга"],["Ш6","Шрам на корі"],
 ["Ш7","Руки, що зшивають"],["Ш8","Квіти з уламків"],["Ш9","Склеєна фотографія"],["Ш10","Сплетені нитки"],["Ш11","Попіл і паросток"],["Ш12","Зібрана постать"],
 ["Д1","Прочинені двері"],["Д2","В’язанка ключів"],["Д3","Роздоріжжя"],["Д4","Міст у тумані"],["Д5","Ранкове вікно"],["Д6","Сходи за поворот"],
 ["Д7","Валіза на порозі"],["Д8","Замкова щілина"],["Д9","Ключ у долоні"],["Д10","Ряд дверей"],["Д11","Перший крок"],["Д12","Хвіртка в саду"],
 ["М1","Дзеркало зі швом"],["М2","Мозаїчні двері"],["М3","Ключ із золотим швом"],["М4","Скриня і сходи"],["М5","Маска на порозі"],["М6","Вітражні двері"]
].map(([c,n],i)=>({c,n,img:SVITLO_IMGS[i]||null}));

function placeholder(card){
  const tone={"Г":["#2b3166","#55467f"],"Ш":["#7d4630","#b9844a"],"Д":["#2f5c4a","#9aae76"],"М":["#2b3166","#9a5a3c"]}[card.c[0]];
  const esc=s=>s.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  const words=card.n.split(' '); const lines=[]; let cur='';
  words.forEach(w=>{ if((cur+' '+w).trim().length>13){lines.push(cur.trim());cur=w;} else cur+=' '+w; }); lines.push(cur.trim());
  const t=lines.map((l,i)=>`<text x="100" y="${196+i*20}" font-size="16" text-anchor="middle" fill="#fbf3dc" font-family="system-ui,sans-serif">${esc(l)}</text>`).join('');
  const svg=`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 300"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${tone[0]}"/><stop offset="1" stop-color="${tone[1]}"/></linearGradient></defs><rect width="200" height="300" fill="url(#g)"/><path d="M0 120 L60 132 L92 118 L130 140 L200 128" stroke="#f2d388" stroke-width="1.5" fill="none" opacity=".8"/><text x="100" y="92" font-size="40" text-anchor="middle" fill="#f2d388" font-family="system-ui,sans-serif" font-weight="600">${esc(card.c)}</text>${t}<text x="100" y="282" font-size="10" text-anchor="middle" fill="#fbf3dc" opacity=".6" font-family="system-ui,sans-serif">зображення ще не додано</text></svg>`;
  return 'data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
}

const DECKS = {
  vona:  {name:'Креатив-1', hash:'kreatyv-1', desc:VONA_IMGS.length+' карт · горизонтальні', imgs:VONA_IMGS, ar:'7/5', arNum:5/7, cw:170, fan:'land'},
  svitlo:{name:'Світло крізь тріщини', hash:'svitlo', desc:SVITLO_CARDS.length+' карти · Грані, Шви, Двері, Містки', imgs:SVITLO_CARDS.map(c=>c.img||placeholder(c)), ar:'2/3', arNum:1.5, cw:130, fan:'port'}
};

/* Схеми розкладу: координати в «клітинках» (ширина/висота карти + проміжок), у порядку вибору карт */
const LAYOUTS = [
  {id:'free',   name:'Без схеми (кількість окремо)'},
  {id:'row3',   name:'Три в ряд — 3', pos:[[0,0],[1,0],[2,0]]},
  {id:'tri',    name:'Трикутник — 3', pos:[[.5,0],[0,1],[1,1]]},
  {id:'row4',   name:'Чотири в ряд — 4', pos:[[0,0],[1,0],[2,0],[3,0]]},
  {id:'square', name:'Квадрат — 4', pos:[[0,0],[1,0],[1,1],[0,1]]},
  {id:'diamond',name:'Ромб — 4', pos:[[1,0],[2,.6],[1,1.2],[0,.6]]},
  {id:'steps',  name:'Сходинки — 4', pos:[[0,1.2],[1,.8],[2,.4],[3,0]]},
  {id:'cross',  name:'Хрест — 5', pos:[[1,1],[1,0],[2,1],[1,2],[0,1]]},
  {id:'row5',   name:'П’ять у ряд — 5', pos:[[0,0],[1,0],[2,0],[3,0],[4,0]]},
  {id:'arc',    name:'Дуга — 5', pos:[[0,.5],[1,.15],[2,0],[3,.15],[4,.5]]},
  {id:'pyramid',name:'Піраміда — 6', pos:[[1,0],[.5,1],[1.5,1],[0,2],[1,2],[2,2]]},
  {id:'grid6',  name:'Два ряди по три — 6', pos:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1]]},
  {id:'grid9',  name:'Квадрат 3×3 — 9', pos:[[0,0],[1,0],[2,0],[0,1],[1,1],[2,1],[0,2],[1,2],[2,2]]}
];
const L = id => LAYOUTS.find(l=>l.id===id);

const $ = s => document.querySelector(s);
const state = { deck:'vona', view:'open', count:1, layout:'free', order:[], picked:[], ov:null };
let ovTimer = null;
const D = () => DECKS[state.deck];
const img = id => D().imgs[id];

function shuffle(a){
  a=a.slice();
  for(let i=a.length-1;i>0;i--){
    const r=new Uint32Array(1); crypto.getRandomValues(r);
    const j=r[0]%(i+1); [a[i],a[j]]=[a[j],a[i]];
  }
  return a;
}
const limit = () => state.layout==='free' ? state.count : L(state.layout).pos.length;
const limited = () => limit()>0;
const full = () => limited() && state.picked.length>=limit();

function build(){
  clearTimeout(ovTimer);
  const N=D().imgs.length;
  state.order = shuffle([...Array(N).keys()]);
  state.picked = [];
  const g=$('#grid'); g.className='grid instant'; g.innerHTML=''; g.dataset.deck=state.deck;
  state.order.forEach(id=>{
    const b=document.createElement('button');
    b.className='card '+state.view+(state.view==='open'?' flipped':'');
    b.dataset.id=id; b.type='button';
    b.setAttribute('aria-label','Картка');
    b.innerHTML='<span class="pos"></span><span class="num"></span><span class="inner"><span class="face back"></span><span class="face front"><img alt="" draggable="false"></span></span>';
    b.querySelector('img').src=img(id);
    b.addEventListener('click',()=>onCard(id,b));
    g.appendChild(b);
  });
  g.querySelectorAll('.card').forEach((c,i)=>c.querySelector('.pos').textContent=i+1);
  requestAnimationFrame(()=>requestAnimationFrame(()=>g.classList.remove('instant')));
  refresh();
}

function onCard(id,el){
  const at=state.picked.indexOf(id);
  if(state.view==='open'){
    if(at>=0){ state.picked.splice(at,1); }
    else{
      if(full()) return;
      state.picked.push(id);
      if(full()) ovTimer=setTimeout(()=>openTable(),450);
    }
  }else{
    if(at>=0){ openSingle(at); return; }
    if(full()) return;
    state.picked.push(id);
    el.classList.add('flipped');
    if(full()) ovTimer=setTimeout(()=>openTable(),900);
  }
  refresh();
}

function refresh(){
  const g=$('#grid');
  g.classList.toggle('locked',full());
  g.querySelectorAll('.card').forEach(c=>{
    const id=+c.dataset.id, at=state.picked.indexOf(id);
    c.classList.toggle('picked',at>=0);
    c.querySelector('.num').textContent = at+1;
    c.setAttribute('aria-pressed',at>=0);
  });
  const n=state.picked.length;
  $('#status').innerHTML = limited() ? `Обрано <b>${n}</b> з ${limit()}` : `Обрано <b>${n}</b>`;
  const t=$('#thumbs');
  t.innerHTML='';
  if(!n){ t.innerHTML='<span class="empty">Обрані картки з’являться тут</span>'; }
  state.picked.forEach((id,i)=>{
    const b=document.createElement('button'); b.className='thumb'; b.type='button';
    b.setAttribute('aria-label','Показати обрану картку '+(i+1));
    b.innerHTML='<img alt="">'; b.firstChild.src=img(id);
    b.addEventListener('click',()=>openSingle(i));
    t.appendChild(b);
  });
  $('#btnShowPicks').disabled=!n;
}

/* overlay */
function defaultOvLayout(n){
  if(state.layout!=='free' && L(state.layout).pos.length===n) return state.layout;
  return 'grid';
}
function openTable(){
  const n=state.picked.length; if(!n) return;
  const keep = state.ov && state.ov.layout;
  state.ov={mode:'table',idx:0,layout: keep && validOv(keep,n) ? keep : defaultOvLayout(n), off:{}};
  renderOv();
}
function validOv(id,n){ return id==='grid'||id==='line'||(L(id)&&L(id).pos&&L(id).pos.length===n); }
function openSingle(i){ const lay=state.ov&&state.ov.layout; state.ov={mode:'single',idx:i,layout:lay,off:state.ov?state.ov.off:{}}; renderOv(); }
function closeOv(){ state.ov=null; $('#overlay').classList.remove('on'); }

function fillOvLayouts(n){
  const s=$('#ovLayout'); s.innerHTML='';
  const opts=[['grid','Сітка'],['line','В один ряд']];
  LAYOUTS.forEach(l=>{ if(l.pos&&l.pos.length===n&&!/^row/.test(l.id)) opts.push([l.id,l.name.replace(/ — \d+$/,'')]); });
  opts.forEach(([v,t])=>{ const o=document.createElement('option'); o.value=v; o.textContent=t; s.appendChild(o); });
  s.value=state.ov.layout;
}

function ovPositions(n,W,H){
  let id=state.ov.layout;
  if(id==='line') return Array.from({length:n},(_,i)=>[i,0]);
  if(id==='grid'){
    const gap=20, ar=D().arNum; let best=0, bc=1;
    for(let c=1;c<=n;c++){ const r=Math.ceil(n/c);
      const w=Math.min((W-gap*(c-1))/c, (H-gap*(r-1))/(r*ar)); if(w>best){best=w;bc=c;} }
    const r=Math.ceil(n/bc), pos=[];
    for(let i=0;i<n;i++){ const row=Math.floor(i/bc), inRow=row===r-1? n-bc*(r-1):bc, col=i%bc;
      pos.push([col+(bc-inRow)/2,row]); }
    return pos;
  }
  return L(id).pos;
}

function renderOv(){
  const o=$('#overlay'), body=$('#ovBody'); const p=state.picked;
  o.classList.add('on'); body.innerHTML='';
  const back=$('#btnBack'), sel=$('#ovLayout');
  if(state.ov.mode==='table'){
    body.className='ov-body table';
    $('#ovTitle').textContent = p.length===1 ? 'Обрана картка' : 'Обрані картки';
    back.hidden=true;
    sel.hidden = p.length<2; if(p.length>1) fillOvLayouts(p.length);
    p.forEach((id,i)=>{
      const b=document.createElement('button'); b.className='ov-card'; b.type='button'; b.dataset.i=i;
      b.setAttribute('aria-label','Картка '+(i+1)+'. Натисніть, щоб збільшити, або перетягніть');
      b.innerHTML='<img alt=""><span class="badge">'+(i+1)+'</span>'; b.firstChild.src=img(id);
      attachDrag(b,i);
      body.appendChild(b);
    });
    if(p.length>1){ const h=document.createElement('div'); h.className='ov-hint'; h.textContent='Карти можна перетягувати'; body.appendChild(h); }
  }else{
    const i=state.ov.idx;
    body.className='ov-body single';
    sel.hidden=true; $('#btnRealign').hidden=true;
    $('#ovTitle').textContent = p.length>1 ? `Картка ${i+1} з ${p.length}` : 'Обрана картка';
    back.hidden = p.length<2;
    const prev=document.createElement('button'); prev.className='arrow'; prev.textContent='‹'; prev.setAttribute('aria-label','Попередня'); prev.hidden=p.length<2;
    const next=document.createElement('button'); next.className='arrow'; next.textContent='›'; next.setAttribute('aria-label','Наступна'); next.hidden=p.length<2;
    const im=document.createElement('img'); im.alt=''; im.src=img(p[i]); im.style.borderRadius='12px'; im.style.boxShadow='0 8px 30px rgba(0,0,0,.5)'; im.style.objectFit='contain';
    prev.onclick=()=>{state.ov.idx=(i-1+p.length)%p.length;renderOv()};
    next.onclick=()=>{state.ov.idx=(i+1)%p.length;renderOv()};
    body.append(prev,im,next);
  }
  fitOv();
}

let geo={w:0,h:0}, zTop=1;
function fitOv(){
  if(!state.ov) return;
  const body=$('#ovBody'), n=state.picked.length;
  if(state.ov.mode==='table'){
    const pad=14, W=body.clientWidth-2*pad, H=body.clientHeight-(n>1?22:0)-2*pad, ar=D().arNum, gap=Math.max(12,Math.min(26,W*.02));
    const pos=ovPositions(n,W,H);
    const maxX=Math.max(...pos.map(q=>q[0])), maxY=Math.max(...pos.map(q=>q[1]));
    // ширина карти w: (maxX)*(w+gap)+w <= W ; (maxY)*(h+gap)+h <= H, h=w*ar
    let w=Math.min((W-maxX*gap)/(maxX+1), (H-maxY*gap)/((maxY+1)*ar));
    w=Math.max(40,Math.floor(w)); const h=Math.floor(w*ar);
    geo={w,h};
    const totW=maxX*(w+gap)+w, totH=maxY*(h+gap)+h;
    const x0=pad+(W-totW)/2, y0=pad+(H-totH)/2;
    let moved=false;
    body.querySelectorAll('.ov-card').forEach(c=>{
      const i=+c.dataset.i, q=pos[i]||[0,0], off=state.ov.off[i]||{x:0,y:0};
      if(off.x||off.y) moved=true;
      c.style.width=w+'px'; c.style.height=h+'px';
      c.style.left=(x0+q[0]*(w+gap)+off.x*w)+'px';
      c.style.top=(y0+q[1]*(h+gap)+off.y*w)+'px';
    });
    $('#btnRealign').hidden=!moved;
  }else{
    const W=body.clientWidth, H=body.clientHeight;
    const im=body.querySelector('img'); const arrows=n>1?2*(48+24):0;
    im.style.maxWidth=Math.max(100,W-arrows)+'px'; im.style.maxHeight=Math.max(100,H)+'px';
  }
}

function attachDrag(el,i){
  let sx=0,sy=0,start=null,drag=false;
  el.addEventListener('pointerdown',e=>{
    if(e.button>0) return;
    el.setPointerCapture(e.pointerId);
    sx=e.clientX; sy=e.clientY; start={...(state.ov.off[i]||{x:0,y:0})}; drag=false;
  });
  el.addEventListener('pointermove',e=>{
    if(!start) return;
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(!drag && Math.hypot(dx,dy)>6){ drag=true; el.classList.add('dragging'); el.style.zIndex=++zTop; }
    if(drag){ state.ov.off[i]={x:start.x+dx/geo.w, y:start.y+dy/geo.w}; fitOv(); }
  });
  const end=()=>{
    if(!start) return;
    const wasDrag=drag; start=null; drag=false; el.classList.remove('dragging');
    if(!wasDrag && state.picked.length>1) openSingle(i);
  };
  el.addEventListener('pointerup',end);
  el.addEventListener('pointercancel',()=>{start=null;drag=false;el.classList.remove('dragging');});
  el.addEventListener('keydown',e=>{ if(e.key==='Enter'||e.key===' '){ e.preventDefault(); if(state.picked.length>1) openSingle(i); } });
}

window.addEventListener('resize',fitOv);
$('#btnClose').onclick=closeOv;
$('#btnBack').onclick=openTable;
$('#btnRealign').onclick=()=>{ state.ov.off={}; fitOv(); };
$('#ovLayout').addEventListener('change',e=>{ state.ov.layout=e.target.value; state.ov.off={}; fitOv(); });
$('#btnShowPicks').onclick=()=>{ state.picked.length===1?openSingle(0):openTable(); };
$('#overlay').addEventListener('click',e=>{ if(e.target.id==='overlay') closeOv(); });
document.addEventListener('keydown',e=>{
  if(!state.ov) return;
  if(e.key==='Escape'){ state.ov.mode==='single'&&state.picked.length>1 ? openTable() : closeOv(); }
  if(state.ov.mode==='single'&&state.picked.length>1){
    const p=state.picked.length;
    if(e.key==='ArrowRight'){state.ov.idx=(state.ov.idx+1)%p;renderOv();}
    if(e.key==='ArrowLeft'){state.ov.idx=(state.ov.idx-1+p)%p;renderOv();}
  }
});

/* controls */
function seg(sel,attr,fn){
  const wrap=$(sel);
  wrap.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b) return;
    wrap.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));
    fn(b.dataset[attr]);
  });
}
(function(){
  const s=$('#selLayout');
  LAYOUTS.forEach(l=>{ const o=document.createElement('option'); o.value=l.id; o.textContent=l.name; s.appendChild(o); });
  s.addEventListener('change',()=>{ state.layout=s.value; $('#grpCount').hidden = state.layout!=='free'; closeOv(); build(); });
})();
function setDeck(d){
  state.deck=d;
  $('#deckTitle').textContent='«'+D().name+'»';
  document.title=D().name+' · Метафоричні карти';
  document.documentElement.style.setProperty('--ar',D().ar);
  document.documentElement.style.setProperty('--cw',D().cw+'px');
  $('#zoom').value=D().cw;
  document.body.classList.add('in-deck');
  closeOv(); build(); window.scrollTo(0,0);
}
function showHome(){
  closeOv(); clearTimeout(ovTimer);
  document.body.classList.remove('in-deck','compact');
  document.title='Метафоричні карти';
  window.scrollTo(0,0);
}
function route(){
  const h=location.hash.slice(1);
  const d=Object.keys(DECKS).find(k=>DECKS[k].hash===h);
  d ? setDeck(d) : showHome();
}
(function(){
  const list=$('#deckList');
  Object.entries(DECKS).forEach(([k,dk])=>{
    const b=document.createElement('button'); b.className='deck-tile'; b.type='button';
    const pick=shuffle([...dk.imgs.keys()]).slice(0,3);
    const fan=dk.fan==='port'
      ? `<img class="c0" alt="" src="${dk.imgs[pick[0]]}"><img class="c2" alt="" src="${dk.imgs[pick[1]]}"><span class="fback c1"></span>`
      : `<img class="c0" alt="" src="${dk.imgs[pick[0]]}"><img class="c2" alt="" src="${dk.imgs[pick[1]]}"><img class="c1" alt="" src="${dk.imgs[pick[2]]}">`;
    b.innerHTML=`<div class="fan ${dk.fan}">${fan}</div><div><h2>«${dk.name}»</h2><p>${dk.desc}</p><span class="go">Відкрити колоду →</span></div>`;
    b.addEventListener('click',()=>{ location.hash=dk.hash; });
    list.appendChild(b);
  });
})();
window.addEventListener('hashchange',route);
$('#btnHome').onclick=()=>{ if(location.hash){ location.hash=''; } else { showHome(); } };
seg('#segView','v',v=>{ state.view=v; closeOv(); build(); });
seg('#segNum','x',x=>document.body.classList.toggle('nonum',x==='0'));
seg('#segCount','n',n=>{ state.count=+n; closeOv(); build(); });
$('#btnReset').onclick=()=>{ closeOv(); build(); };
$('#zoom').addEventListener('input',e=>document.documentElement.style.setProperty('--cw',e.target.value+'px'));
$('#btnHide').onclick=()=>document.body.classList.add('compact');
$('#btnShow').onclick=()=>document.body.classList.remove('compact');
route();
</script>
</body>
</html>
